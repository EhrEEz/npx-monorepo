services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Environment
      - ENV_MODE=${ENV_MODE:-production}
      - NODE_ENV=production

      # Payload
      - PRIVATE_PAYLOAD_SECRET=${PRIVATE_PAYLOAD_SECRET}
      - PAYLOAD_SECRET=${PRIVATE_PAYLOAD_SECRET}

      # Database
      - PRIVATE_WRITE_DATABASE_URI=${PRIVATE_WRITE_DATABASE_URI}
      - PRIVATE_DATABASE_URI=${PRIVATE_DATABASE_URI}
      - DATABASE_URI=${PRIVATE_DATABASE_URI}

      # Mailchimp
      - PRIVATE_MAILCHIMP_API_KEY=${PRIVATE_MAILCHIMP_API_KEY}
      - PRIVATE_AUDIENCE_KEY=${PRIVATE_AUDIENCE_KEY}

      # Migration
      - PRIVATE_MIGRATION_TOKEN=${PRIVATE_MIGRATION_TOKEN}

      # Storage
      - PRIVATE_DELPLOYMENT_STORAGE=${PRIVATE_DELPLOYMENT_STORAGE}

      # S3
      - PRIVATE_S3_REGION=${PRIVATE_S3_REGION}
      - PRIVATE_S3_ACCESS_KEY_ID=${PRIVATE_S3_ACCESS_KEY_ID}
      - PRIVATE_S3_SECRET_ACCESS_KEY=${PRIVATE_S3_SECRET_ACCESS_KEY}
      - PRIVATE_S3_BUCKET_NAME=${PRIVATE_S3_BUCKET_NAME}
      - PRIVATE_S3_ENDPOINT=${PRIVATE_S3_ENDPOINT}

      # URLs
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PAYLOAD_PUBLIC_SERVER_URL=${PUBLIC_API_URL}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Environment
      - ENV_MODE=${ENV_MODE:-production}
      - NODE_ENV=production

      # Payload
      - PRIVATE_PAYLOAD_SECRET=${PRIVATE_PAYLOAD_SECRET}
      - PAYLOAD_SECRET=${PRIVATE_PAYLOAD_SECRET}

      # Database
      - PRIVATE_WRITE_DATABASE_URI=${PRIVATE_WRITE_DATABASE_URI}
      - PRIVATE_DATABASE_URI=${PRIVATE_DATABASE_URI}
      - DATABASE_URI=${PRIVATE_DATABASE_URI}

      # Mailchimp
      - PRIVATE_MAILCHIMP_API_KEY=${PRIVATE_MAILCHIMP_API_KEY}
      - PRIVATE_AUDIENCE_KEY=${PRIVATE_AUDIENCE_KEY}

      # Migration
      - PRIVATE_MIGRATION_TOKEN=${PRIVATE_MIGRATION_TOKEN}

      # Storage
      - PRIVATE_DELPLOYMENT_STORAGE=${PRIVATE_DELPLOYMENT_STORAGE}

      # S3
      - PRIVATE_S3_REGION=${PRIVATE_S3_REGION}
      - PRIVATE_S3_ACCESS_KEY_ID=${PRIVATE_S3_ACCESS_KEY_ID}
      - PRIVATE_S3_SECRET_ACCESS_KEY=${PRIVATE_S3_SECRET_ACCESS_KEY}
      - PRIVATE_S3_BUCKET_NAME=${PRIVATE_S3_BUCKET_NAME}
      - PRIVATE_S3_ENDPOINT=${PRIVATE_S3_ENDPOINT}

      # URLs
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PAYLOAD_PUBLIC_SERVER_URL=${PUBLIC_API_URL}
      # URLs
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PUBLIC_CLIENT_URL=${PUBLIC_CLIENT_URL}

      # Web3Forms
      - PUBLIC_WEB3FORMS_ACCESS_KEY=${PUBLIC_WEB3FORMS_ACCESS_KEY}

    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5173', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
